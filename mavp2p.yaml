# mavp2p 配置文件。
#
# 按序加载（后者覆盖前者）：
#   1. ./mavp2p.yaml                  —— 当前工作目录（云端 systemd 的 WorkingDirectory=/opt/uavm）
#   2. ~/.config/mavp2p/mavp2p.yaml   —— 用户级
# 文件**不存在则静默跳过**（kong 的 os.IsNotExist 分支）⇒ 某台机器不放也能启动，走代码里的 default。
#
# ‼️ 这里只提供**默认值**：命令行显式给出的参数优先级更高
#    （kong context.go 的 Resolve()：已在命令行出现的 flag 直接 continue）。
#
# ‼️ key 的写法只有两种（与 kong 内置的 kong.JSON 一致）：
#      连字符换下划线   map_ttl        ← 推荐，与 --help 的参数名一一对应
#      camelCase        mapTtl
#    连字符原样的 `map-ttl` **不认**。写错的 key 不会静默生效：main.go 的
#    yamlResolver.Validate 会把它列出来并拒绝启动。
#    ⚠️ 别照直觉缩写：单 QGC 关联上限是 `max_qgc_linked_px_4`
#       （`--help` 里就是 --max-qgc-linked-px-4，末尾的 4 是独立一段）。
#
# 本文件只放**跨部署相同的语义参数**；endpoints、gcs_endpoint、--fifo-path 等因机器而异的项
# 留在各自的启动文件（systemd unit / 脚本）里。
#
# ‼️ gcs_endpoint（地面站入口端点，例如 udps:0.0.0.0:5601）是**必填**的，且不得与任何
#    endpoints（载具端点）相同：上下行方向由入口端点决定，不再从 counter 奇偶推断。

# 映射/在线/配对三张状态表的 TTL（协议附录 A.1 MAP_TTL，规范给的是**建议值** 60s）。
#
# ‼️ 本部署取 30s，是对该建议值的**有意偏离**（2026-10-05 裁定）：让 QGC「签出」后尽快
#    停止收帧。签出 ⇒ 该 QGC 下一轮 80005 不再声明该 deviceID，其 1Hz 加密上行心跳也停了
#    ⇒ 配对的 **qgcSeen** 不再刷新 ⇒ 超过 30s 后 fanoutTargets 不再把下行投给它。
#
# ‼️ 这个 30s 卡的是**投递**（qgcSeen），不是**配对的删除**。配对是否被 prune 删掉看的是
#    另外两个时间戳（manager.go 的 pairEntry 注释）：lastSeen 到 TTL 删、qgcSeen 到 10×TTL
#    兜底删、lastTraffic 到 StateIdleTimeout（10 分钟）删。任务进行中 PX4 加密下行的每一帧
#    都刷 lastSeen/lastTraffic ⇒ 配对常驻、不会有「删除 → 等下一次 80005 重建」的空窗；
#    而「签出后还收不收得到帧」由 qgcSeen 单独把关 —— 两道判据刻意不互补，
#    **别为了让「TTL 到期就删」成立去删掉 PX4 下行那行刷新**（2026-10-05 这么做，误伤了
#    一时安静的航线监控员 QGC）。
#
# 余量核算（余量 = 30s ÷ 该表**最慢**的保活周期，周期越大余量越小）：
#   px4Map     —— 两条保活源，取最慢的那条：PX4 明文待命心跳（**1Hz ⇒ 1000ms**）与
#                 加密下行（10Hz ⇒ 100ms；manager.go 在该分支刷 lastSeen）⇒ 周期
#                 1000ms，余量 30×。
#                 ‼️ 规范 §2.5 原文写的是「默认 20Hz」，那是**过时描述**：PX4 侧
#                 HEARTBEAT 流默认 `configure_stream("HEARTBEAT", 1.0f)`，且本仓
#                 SITL 的 `init.d-posix/px4-rc.mavlink` 也显式 `-r 1`（2026-10-27
#                 由 2Hz 下调）。按实现取 1Hz 核算，别照规范那个数字调参。
#   qgcSeen    —— 决定**投递**的那一个：1Hz 加密上行心跳（规范逐字：「心跳 1Hz 是配对的
#                 **主要**保活源」）⇒ 余量 30×
#   lastSeen   —— 决定配对**存活**：QGC 侧两源 + PX4 加密下行。最慢的 QGC 侧源是
#                 80005 的一轮（见下）⇒ 余量 3× / 1.5× / ≤1×，按 n 分档，不是 30×
#   qgcOnline  —— 80005 登记与活跃加密上行**都**刷它（manager.go 两处），最慢的是前者，
#                 周期见下面这条 ⚠️
# ⚠️ 80005 是**分片轮转**协议：单条 payload 最多带 max_qgc_linked_px_4 个 deviceID
#    （manager.go 对 num 有 cap，默认 16），关联更多的 QGC 要分批发。故一轮 =
#    ceil(n/16) × 10s，其中 n = **该 QGC 关联的整个 deviceID 集合大小**（不是全网飞机
#    总数，也不是单条 payload 里声明的个数——后者上限就是那个 cap）。qgcOnline 以及
#    「加密上行心跳缺席时」仅靠登记保活的 qgcSeen/lastSeen，其保活周期就等于这一轮：
#      n ≤ 16  ⇒ 一轮 10s  ⇒ 余量 3×     宽裕
#      n 17–32 ⇒ 一轮 20s  ⇒ 余量 1.5×   只剩一拍容错，丢一拍就贴边
#      n ≥ 33  ⇒ 一轮 ≥30s ⇒ 余量 ≤1×    ✗ 会把在册飞机误删 —— 届时应调大 map_ttl
#    本机真库 table_uav 现为 **27** 行（2026-10-05 实测）⇒ 若某台 QGC 关联了全部，n=27
#    落在 1.5× 那一档。
map_ttl: 30s

# 待命心跳防伪造闸的时间窗（--standby-guard）。明文待命心跳无认证：不加闸时，任何能向
# 载具端点发包的来源都能凭一个合法飞机号段伪造一帧，一次就改写 px4Map.channel（QGC 上行
# 被改投攻击者）、清配对（任务 QGC 断联）、清双方向水位并复位 handshaked，还把伪造帧
# 扇出给所有 QGC 并送进 FIFO（data_writer 把飞机标成离线）。
#
# 判据不是纯时间：**同一条通道**来的待命心跳（= 刚送加密下行的那个源）永远放行，合法
# 任务结束立即生效；只有**异通道**且该机近期仍有加密下行（或下行水位仍在窗口内）时才
# 丢弃。窗口越长，伪造越难奏效；代价是 PX4 中途重启并换了源端口时，恢复最多延迟一个
# 窗口（期间配对/水位保持不变）。负值拒绝启动；零值回落默认 5m。
standby_guard: 5m

# 长期状态表空闲回收（--state-idle-timeout）。与 map_ttl 是**两套机制**：
#   map_ttl   —— 刷新式 TTL，看 lastSeen/qgcSeen，被杀活帧（80005、待命心跳）反复续期；
#   state_idle_timeout —— 兜底的卫生清理，只看**真实转发的加密流量**（pair.lastTraffic）
#                与水位 lastSeen。80005 周期登记**不**算流量，所以「声明过、PX4 从未上线」
#                的幽灵配对最终会被它清掉，不会被 10s 一轮的登记无限续命。
# 到期清理对象：pairs（lastTraffic 超时）、lastNonce（两个方向，各自 lastSeen）、
# hbDiag/fanoutDiag/verifyDiag（按各自的最后写入时刻）、dropDiag（按上次告警时刻，兜底
# 通道关闭事件漏报）。regDiag 例外，随 qgcOnline 成员关系回收。
state_idle_timeout: 10m

# ---- 待命扇出与上行候选（2026-10 多 QGC / NAT 漂移整改）----
#
# 背景：PX4 明文待命心跳的扇出目标、以及「上行该发给哪台 QGC」的候选来源，都不能
# 在收到帧的那一刻直接决定——同一 deviceID 可能同时有多个来源 IP（NAT 重建、历史通道），
# 而在飞任务的真身要靠加密流量才能确定。故先把来源记进候选表，按窗口聚合后再发布。
#
# standby_fanout_interval：每设备候选发布的聚合窗口。窗口内同一设备的多次候选合并为一次
#   扇出/Sink 发布；**任务结束路径不受这个窗口限制**（待命心跳清配对必须立即生效）。
standby_fanout_interval: 2s

# 每设备上行候选上限（含至多 1 条「保护候选」）。保护候选＝该设备最近一次确认过的来源，
# 全局淘汰时也先保它，防止真身在多条候选的乱序里被挤掉。
max_candidates_per_device: 3

# 候选表总条数上限。满时**拒绝新 deviceID 的普通候选**，已有设备刷新不受影响
# （否则老设备会在表满后被饿死，而新来源不断挤进来）。
max_candidates_global: 4096

# 每设备「新增来源 IP 入表」的最小间隔；刷新已有候选不受限。
candidate_admit_interval: 1s

# 全局新候选准入速率（令牌/秒），单位＝一次「新来源 IP 入表」（不是帧数）。
global_candidate_admit_rate: 50

# 全局候选发布预算（令牌/秒），单位＝一次聚合发布（不是帧数）。与上一条分开，
# 是因为「入表」和「对外发布」是两个可能被分别放大的动作。
global_fanout_rate: 100

# 上行目标集上限（含已验签的通道），必须 ≥2。歧义期（候选尚未收敛/验签结果未回）
# 上行会**多播**给目标集，而不是赌一条通道。
max_uplink_targets: 3

# ---- 本地验签服务（oracle）----
#
# 建链期的下行、以及换通道后的首帧，必须由本地验签服务确认「这确实是该 deviceID 的加密
# 帧」才能放行；这套判定 mavp2p 自己做不了（它不持有密钥，见 CLAUDE.md「不解密」）。
# 验签服务由 data_writer 进程内的 oracle goroutine 提供（同一个 socket 的 server 端）。
#
# ‼️ 部署依赖：这个 socket 必须由 data_writer 先建好。mavp2p 不检查它是否存在——
#    服务不可用时，需要验签的帧按 fail-closed **丢弃**（日志/diag 行可见），已建链、
#    同通道的加密帧不受影响。也就是说：data_writer 没起来时，已建链的飞机仍能飞，
#    但新建立的链路会起不来。请把两者的启动顺序与 systemd 依赖写进部署脚本。
#
# ‼️ 这里是 **Unix socket（本机）**，不是网络接口。两者必须在同一台机器、同一 mount
#    命名空间里；跨容器部署时要把这个路径挂进去。
verify_socket: /run/uavm/verify.sock

# 单次验签请求超时。超时＝该帧按失败丢弃（fail-closed），不重试、不猜。
verify_timeout: 5ms

# 每设备验签排队上限（同一时刻 1 个 in-flight，按入队顺序处理）。
# 注意：同一设备的帧**串行**验签是有意为之的（保持设备内顺序）。
verify_queue_per_device: 8

# 全局验签排队上限。满时丢弃**最新**帧，不阻塞主事件循环。
verify_queue_global: 256
