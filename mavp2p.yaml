# mavp2p 配置文件。
#
# 按序加载（后者覆盖前者）：
#   1. ./mavp2p.yaml                  —— 当前工作目录（云端 systemd 的 WorkingDirectory=/opt/uavm）
#   2. ~/.config/mavp2p/mavp2p.yaml   —— 用户级
# 文件**不存在则静默跳过**（kong 的 os.IsNotExist 分支）⇒ 某台机器不放也能启动，走代码里的 default。
#
# ‼️ 这里只提供**默认值**：命令行显式给出的参数优先级更高
#    （kong context.go 的 Resolve()：已在命令行出现的 flag 直接 continue）。
#
# ‼️ key 的写法只有两种（与 kong 内置的 kong.JSON 一致）：
#      连字符换下划线   map_ttl        ← 推荐，与 --help 的参数名一一对应
#      camelCase        mapTtl
#    连字符原样的 `map-ttl` **不认**。写错的 key 不会静默生效：main.go 的
#    yamlResolver.Validate 会把它列出来并拒绝启动。
#    ⚠️ 别照直觉缩写：单 QGC 关联上限是 `max_qgc_linked_px_4`
#       （`--help` 里就是 --max-qgc-linked-px-4，末尾的 4 是独立一段）。
#
# 本文件只放**跨部署相同的语义参数**；endpoints、gcs_endpoint、--fifo-path 等因机器而异的项
# 留在各自的启动文件（systemd unit / 脚本）里。
#
# ‼️ gcs_endpoint（地面站入口端点，例如 udps:0.0.0.0:5601）是**必填**的，且不得与任何
#    endpoints（载具端点）相同：上下行方向由入口端点决定，不再从 counter 奇偶推断。

# 映射/在线/配对三张状态表的 TTL（协议附录 A.1 MAP_TTL，规范给的是**建议值** 60s）。
#
# ‼️ 本部署取 30s，是对该建议值的**有意偏离**（2026-10-05 裁定）：让 QGC「签出」后尽快
#    停止收帧。签出 ⇒ 该 QGC 下一轮 80005 不再声明该 deviceID，其 1Hz 加密上行心跳也停了
#    ⇒ 配对的 **qgcSeen** 不再刷新 ⇒ 超过 30s 后 fanoutTargets 不再把下行投给它。
#
# ‼️ 这个 30s 卡的是**投递**（qgcSeen），不是**配对的删除**。配对是否被 prune 删掉看的是
#    另外两个时间戳（manager.go 的 pairEntry 注释）：lastSeen 到 TTL 删、qgcSeen 到 10×TTL
#    兜底删、lastTraffic 到 StateIdleTimeout（10 分钟）删。任务进行中 PX4 加密下行的每一帧
#    都刷 lastSeen/lastTraffic ⇒ 配对常驻、不会有「删除 → 等下一次 80005 重建」的空窗；
#    而「签出后还收不收得到帧」由 qgcSeen 单独把关 —— 两道判据刻意不互补，
#    **别为了让「TTL 到期就删」成立去删掉 PX4 下行那行刷新**（2026-10-05 这么做，误伤了
#    一时安静的航线监控员 QGC）。
#
# 余量核算（余量 = 30s ÷ 该表**最慢**的保活周期，周期越大余量越小）：
#   px4Map     —— 两条保活源，取最慢的那条：PX4 明文待命心跳（规范 §2.5 逐字「默认
#                 20Hz」⇒ 50ms）与加密下行（10Hz ⇒ 100ms；manager.go 在该分支刷
#                 lastSeen）⇒ 周期 100ms，余量 300×
#   qgcSeen    —— 决定**投递**的那一个：1Hz 加密上行心跳（规范逐字：「心跳 1Hz 是配对的
#                 **主要**保活源」）⇒ 余量 30×
#   lastSeen   —— 决定配对**存活**：QGC 侧两源 + PX4 加密下行。最慢的 QGC 侧源是
#                 80005 的一轮（见下）⇒ 余量 3× / 1.5× / ≤1×，按 n 分档，不是 30×
#   qgcOnline  —— 80005 登记与活跃加密上行**都**刷它（manager.go 两处），最慢的是前者，
#                 周期见下面这条 ⚠️
# ⚠️ 80005 是**分片轮转**协议：单条 payload 最多带 max_qgc_linked_px_4 个 deviceID
#    （manager.go 对 num 有 cap，默认 16），关联更多的 QGC 要分批发。故一轮 =
#    ceil(n/16) × 10s，其中 n = **该 QGC 关联的整个 deviceID 集合大小**（不是全网飞机
#    总数，也不是单条 payload 里声明的个数——后者上限就是那个 cap）。qgcOnline 以及
#    「加密上行心跳缺席时」仅靠登记保活的 qgcSeen/lastSeen，其保活周期就等于这一轮：
#      n ≤ 16  ⇒ 一轮 10s  ⇒ 余量 3×     宽裕
#      n 17–32 ⇒ 一轮 20s  ⇒ 余量 1.5×   只剩一拍容错，丢一拍就贴边
#      n ≥ 33  ⇒ 一轮 ≥30s ⇒ 余量 ≤1×    ✗ 会把在册飞机误删 —— 届时应调大 map_ttl
#    本机真库 table_uav 现为 **27** 行（2026-10-05 实测）⇒ 若某台 QGC 关联了全部，n=27
#    落在 1.5× 那一档。
map_ttl: 30s
